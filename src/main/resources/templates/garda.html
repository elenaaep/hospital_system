<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionare Garda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f4f4f4;
        }

        .navbar {
            width: 200px;
            height: 100vh;
            background-color: #00561B;
            position: fixed;
            top: 0;
            left: 0;
            overflow-x: hidden;
            padding-top: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: normal;
        }

        .navbar img {
            width: 80px;
            margin-bottom: 80px;
        }

        .navbar a, .dropdown-btn, .schedule, .logout-btn {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            text-align: left;
            width: 100%;
            border: none;
            background: none;
            cursor: pointer;
            outline: none;
        }

        .navbar a:hover, .dropdown-btn:hover, .schedule:hover, .logout-btn:hover {
            background-color: #ddd;
            color: #568203;
        }

        .navbar a.active {
            background-color: #dab30a;
            color: white;
        }

        .navbar button {
            padding: 10px 15px;
            font-size: 18px;
            color: white;
            background-color: #00561B;
            border: none;
            cursor: pointer;
            text-align: left;
            width: 100%;
            margin-bottom: 15px;
        }

        .navbar button:hover {
            background-color: #ddd;
            color: #568203;
        }

        .dropdown-container {
            display: none;
            background-color: #679F5A;
            padding-left: 15px;
            width: 100%;
        }

        .dropdown-container a {
            padding: 8px 15px;
        }

        .spacer {
            flex-grow: 0.8;
        }

        .main-content {
            margin-left: 220px;
            padding: 20px;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            color: #00561B;
            margin-bottom: 20px;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #00561B;

        }

        .form-container input[type="text"],
        .form-container input[type="number"],
        .form-container input[type="date"],
        .form-container select {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #679F5A;
            border-radius: 5px;
            font-size: 16px;
            color: #333;

        }

        /* Container pentru formular și tabel */
        .form-container, .table-container {
            width: 100%;
            max-width: 1200px; /* Lățimea maximă a containerului */
            margin: 0 auto; /* Centrează containerul */
            padding: 20px;
            background-color: #f4f4f4; /* Fundal pentru a se potrivi cu restul paginii */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Ușor efect de umbră */
            border-radius: 8px; /* Colțuri rotunjite */
        }

        /* Stilul pentru tabel */
        table {
            width: 100%; /* Tabelul să ocupe întreaga lățime a containerului */
            border-collapse: collapse;
            background-color: #fff;
            margin-top: 20px; /* Adaugă spațiu între formular și tabel */
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #00561B; /* Culoarea de fundal pentru antet */
            color: white;
        }

        /* Stilul pentru butoane */
        button {
            margin-right: 10px; /* Spațiu între butoane */
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Stil pentru butonul de adăugare gardă */
        .add-button {
            background-color: #28a745; /* Verde pentru un aspect pozitiv */
            color: white;
            padding: 12px 15px; /* Adăugat mai mult spațiu pentru buton */
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            width: 150px; /* Lățime fixă pentru buton */
            margin-top: 20px; /* Spațiu deasupra butonului */
            display: block;
            transition: background-color 0.3s, transform 0.2s;
        }

        .add-button:hover {
            background-color: #218838; /* Verde mai închis la hover */
            transform: scale(1.05); /* Mărire la hover pentru efect de interacțiune */
        }

        .add-button:active {
            background-color: #1e7e34; /* Culoare mai închisă la apăsare */
            transform: scale(1); /* Revine la dimensiunea originală */
        }

        /* Stil pentru butoanele de acțiune (Delete și Edit) */
        .delete-btn,
        .edit-btn {
            padding: 8px 15px;
            font-size: 16px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            transition: background-color 0.3s, transform 0.2s;
            margin-right: 10px;
        }

        /* Stil pentru butonul de delete */
        .delete-btn {
            background-color: #e60000; /* Roșu */
        }

        .delete-btn:hover {
            background-color: #c70000; /* Roșu mai închis la hover */
            transform: scale(1.05); /* Mărire la hover */
        }

        .delete-btn:active {
            background-color: #b30000; /* Roșu și mai închis la apăsare */
            transform: scale(1); /* Revine la dimensiunea originală */
        }

        /* Stil pentru butonul de edit */
        .edit-btn {
            background-color: #dab30a; /* Culoarea galbenă pentru editare */
        }

        .edit-btn:hover {
            background-color: #a68a08; /* Galben mai închis la hover */
            transform: scale(1.05); /* Mărire la hover */
        }

        .edit-btn:active {
            background-color: #8c7607; /* Galben și mai închis la apăsare */
            transform: scale(1); /* Revine la dimensiunea originală */

            button:hover {
                opacity: 0.9;
            }

        }

        .btn-container {
            display: grid;
            grid-template-columns: repeat(3, auto); /* Trei coloane de lățime automată */
            gap: 10px; /* Spațiu între butoane */
            justify-content: left; /* Centrează pe orizontală */
        }

        .add-button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }

        .add-button:hover {
            background-color: #45a049;
        }

        form {
            display: flex;
            align-items: center;
            gap: 15px; /* Spațiere între elemente */
            margin: 20px 0;
        }

        form label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        form input[type="date"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
        }

        form button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        form button:hover {
            background-color: #45a049;
        }


    </style>
</head>
<body>

<div class="navbar">
    <div>
        <img src="/images/hospital.png" alt="Hospital Logo">
        <a href="/doctor">Acasă</a>
        <a href="programari.html" class="schedule">Programări</a>
        <button class="dropdown-btn">Pacienți</button>
        <div class="dropdown-container">
            <a href="/pacients">Vizualizare Pacienți</a>
            <a href="istoric_pacienti.html">Istoric Pacienți</a>
        </div>
        <a href="/garda" class="schedule">Adăugare Gardă</a>
        <a href="/mesaje">Contact</a>
    </div>
    <div class="spacer"></div>
    <form action="/logout" method="post">
        <button type="submit">Ieșire</button>
    </form>
</div>


<div class="main-content">
    <h1>Gestionare Garda</h1>

    <div class="btn-container">
        <a href="/garda/new" class="add-button">Adaugă Garda</a>
        <a href="/garda/export" class="add-button">Exportă în CSV</a>
        <a href="/exportGarda" class="add-button">Exportă în PDF</a>
    </div>



    <h1>Raport Gărzi</h1>

    <!-- Formular pentru selectarea perioadei -->
    <form action="/garde" method="get">
        <label for="startDate">Data Început:</label>
        <input type="date" id="startDate" name="startDate">

        <label for="endDate">Data Sfârșit:</label>
        <input type="date" id="endDate" name="endDate">

        <button type="submit">Generare Raport</button>
    </form>


    <!-- Tabelul cu gărzi existente -->
    <div class="container">
        <table class="table">
            <thead>
            <tr>
                <th>ID Garda</th>
                <th>ID Doctor</th>
                <th>ID Asistent</th>
                <th>Tip Persoană</th>
                <th>Data Început</th>
                <th>Data Sfârșit</th>
                <th>Nr. Pacienți Îngrijiți</th>
                <th>Consumabile Folosite</th>
                <th>Acțiuni</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="garda : ${gardaList}">
                <td th:text="${garda.idGarda}"></td>
                <td th:text="${garda.idDoc}"></td>
                <td th:text="${garda.idAsistent}"></td>
                <td th:text="${garda.persTip}"></td>
                <td th:text="${#dates.format(garda.dataInceput, 'dd/MM/yyyy')}"></td>
                <td th:text="${#dates.format(garda.dataSfarsit, 'dd/MM/yyyy')}"></td>
                <td th:text="${garda.nrPacientiIngrijiti}"></td>
                <td th:text="${garda.consumabileFolosite}"></td>
                <td>
                    <!-- Link pentru ștergere -->
                    <a th:href="@{/garda/delete/{id}(id=${garda.idGarda})}" class="delete-btn">Șterge</a>

                    <!-- Link pentru editare -->
                    <a th:href="@{/garda/edit/{id}(id=${garda.idGarda})}" class="edit-btn">Editează</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // Afișează formularul de adăugare
    document.getElementById('showAddFormBtn').addEventListener('click', function() {
        document.getElementById('addFormContainer').style.display = 'block';
    });

    // Anulează formularul de adăugare
    document.getElementById('cancelAddFormBtn').addEventListener('click', function() {
        document.getElementById('addFormContainer').style.display = 'none';
    });
</script>
