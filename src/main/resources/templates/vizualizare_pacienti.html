<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacienți</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar {
            width: 200px;
            height: 100vh;
            background-color: #00561B;
            position: fixed;
            top: 0;
            left: 0;
            overflow-x: hidden;
            padding-top: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: normal;
        }

        .navbar img {
            width: 80px;
            margin-bottom: 80px;
        }

        .navbar a, .dropdown-btn, .schedule, .logout-btn {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            text-align: left;
            width: 100%;
            border: none;
            background: none;
            cursor: pointer;
            outline: none;
        }

        .navbar a:hover, .dropdown-btn:hover, .schedule:hover, .logout-btn:hover {
            background-color: #ddd;
            color: #568203;
        }

        .navbar a.active {
            background-color: #dab30a;
            color: white;
        }

        .dropdown-container {
            display: none;
            background-color: #679F5A;
            padding-left: 15px;
            width: 100%;
        }

        .dropdown-container a {
            padding: 8px 15px;
        }

        .spacer {
            flex-grow: 0.8;
        }

        .main-content {
            margin-left: 220px;
            padding: 20px;
            max-width: 1400px;
            overflow-x: auto;
        }

        h1 {
            font-size: 32px;
            color: #00561B;
            margin-bottom: 20px;
        }

        .add-button {
            margin-left: 10px;
            padding: 10px 15px;
            font-size: 16px;
            background-color: #00561B;
            color: white;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            border-radius: 5px;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        .add-button:hover {
            background-color: #568203;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px; /* Spațiere mai mare între toate elementele din bară */
        }

        .search-bar input[type="text"] {
            width: 60%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .search-bar select {
            margin-right: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #dab30a;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .search-bar select:hover {
            background-color: #cfa108;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .search-bar select:focus {
            outline: none;
            border-color: #568203;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .search-bar button {
            padding: 10px 20px;
            background-color: #00561B;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .search-bar button:hover {
            background-color: #568203;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #00561B;
            color: white;
        }

        td {
            background-color: #f9f9f9;
        }

        .navbar form button {
            padding: 10px 15px;
            font-size: 18px;
            color: white;
            background-color: #00561B;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .navbar form button:hover {
            background-color: #568203;
            color: white;
        }

        .highlight {
            background-color: #e0f7fa;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <img src="/images/hospital.png" alt="Hospital Logo">
        <a href="/doctor">Acasă</a>
        <a href="programari.html" class="schedule">Programări</a>
        <button class="dropdown-btn">Pacienți</button>
        <div class="dropdown-container">
            <a href="vizualizare_pacienti.html">Vizualizare Pacienți</a>
            <a href="istoric_pacienti.html">Istoric Pacienți</a>
        </div>
        <a href="garda.html" class="schedule">Adăugare Gardă</a>
        <a href="contact.html">Contact</a>
    </div>
    <div class="spacer"></div>
    <form action="/logout" method="post">
        <button type="submit">Ieșire</button>
    </form>
</div>

<div class="main-content">
    <h1>Lista Pacienților</h1>

    <form method="get" action="/pacients" class="search-bar">
        <input type="text" name="search" th:value="${searchTerm}" placeholder="Căutare pacienți...">

        <select name="gen">
            <option value="">Gen</option>
            <option value="M" th:selected="${gen == 'M'}">Masculin</option>
            <option value="F" th:selected="${gen == 'F'}">Feminin</option>
        </select>
        <select name="rh">
            <option value="">Rh</option>
            <option value="pozitiv" th:selected="${rh == 'pozitiv'}">Pozitiv</option>
            <option value="negativ" th:selected="${rh == 'negativ'}">Negativ</option>
        </select>
        <select name="grupaSange">
            <option value="">Grupa de sânge</option>
            <option value="A" th:selected="${grupaSange == 'A'}">A</option>
            <option value="B" th:selected="${grupaSange == 'B'}">B</option>
            <option value="O" th:selected="${grupaSange == 'O'}">O</option>
            <option value="AB" th:selected="${grupaSange == 'AB'}">AB</option>
        </select>
        <button type="submit">Căutare</button>
        <a href="/new" class="add-button">Adaugă Pacient</a>
    </form>

    <div class="container">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nume</th>
                <th>Prenume</th>
                <th>CNP</th>
                <th>Data Nașterii</th>
                <th>Gen</th>
                <th>Vârstă</th>
                <th>Adresă</th>
                <th>Telefon</th>
                <th>Email</th>
                <th>Grupa de sânge</th>
                <th>Rh</th>
                <th>Acțiuni</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pacient : ${pacienti}">
                <td th:text="${pacient.idPacient}"></td>
                <td th:text="${pacient.nume}"></td>
                <td th:text="${pacient.prenume}"></td>
                <td th:text="${pacient.cnp}"></td>
                <td th:text="${#dates.format(pacient.dataNasterii, 'dd/MM/yyyy')}"></td>
                <td th:text="${pacient.gen}"></td>
                <td th:text="${pacient.varsta}"></td>
                <td th:text="${pacient.adresa}"></td>
                <td th:text="${pacient.tel}"></td>
                <td th:text="${pacient.email}"></td>
                <td th:text="${pacient.grupaSange}"></td>
                <td th:text="${pacient.rh}"></td>
                <td>
                    <a th:href="@{/pacienti/delete/{id}(id=${pacient.idPacient})}" class="delete-btn">Șterge</a>
                    <a th:href="@{/edit/{id}(id=${pacient.idPacient})}" class="edit-btn">Editează</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
