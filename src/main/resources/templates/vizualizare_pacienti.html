<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacienți</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar {
            width: 200px;
            height: 100vh;
            background-color: #00561B;
            position: fixed;
            top: 0;
            left: 0;
            overflow-x: hidden;
            padding-top: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: normal;
        }

        .navbar img {
            width: 80px;
            margin-bottom: 80px;
        }

        .navbar a, .dropdown-btn, .schedule, .logout-btn {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            text-align: left;
            width: 100%;
            border: none;
            background: none;
            cursor: pointer;
            outline: none;
        }

        .navbar a:hover, .dropdown-btn:hover, .schedule:hover, .logout-btn:hover {
            background-color: #ddd;
            color: #568203;
        }

        .navbar a.active {
            background-color: #dab30a;
            color: white;
        }

        .navbar button {
            padding: 10px 15px;
            font-size: 18px;
            color: white;
            background-color: #00561B;
            border: none;
            cursor: pointer;
            text-align: left;
            width: 100%;
            margin-bottom: 15px;
        }

        .navbar button:hover {
            background-color: #ddd;
            color: #568203;
        }

        .dropdown-container {
            display: none;
            background-color: #679F5A;
            padding-left: 15px;
            width: 100%;
        }

        .dropdown-container a {
            padding: 8px 15px;
        }

        .spacer {
            flex-grow: 0.8;
        }

        .main-content {
            margin-left: 220px;
            padding: 20px;
            max-width: 1400px;
            overflow-x: auto;
        }

        h1 {
            font-size: 32px;
            color: #00561B;
            margin-bottom: 20px;
        }

        .add-button {
            margin-left: 10px;
            padding: 11px 20px; /* Reduce lățimea (padding orizontal), crește lungimea (padding vertical) */
            font-size: 16px; /* Dimensiunea fontului mai mică */
            background-color: #00561B;
            color: white;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            border-radius: 5px;
            transition: background-color 0.3s;
            white-space: nowrap
        }

        .add-button:hover {
            background-color: #568203;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar input[type="text"] {
            width: 60%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .search-bar select {
            margin-right: 10px; /* Spațiere între select-uri */

            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #dab30a;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .search-bar select:hover {
            background-color: #cfa108;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .search-bar select:focus {
            outline: none;
            border-color: #568203;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .search-bar > * {
            margin-right: 15px; /* Spațiere uniformă între toate elementele */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #00561B;
            color: white;
        }

        td {
            background-color: #f2f2f2;
        }

        .highlight {
            background-color: #e0f7fa;
        }

        .action-icon {
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

        .edit-btn, .delete-btn {
            padding: 5px;
            margin-right: 5px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .edit-btn img {
            filter: invert(65%) sepia(82%) saturate(641%) hue-rotate(13deg) brightness(101%) contrast(105%);
        }

        .delete-btn img {
            filter: invert(24%) sepia(72%) saturate(7511%) hue-rotate(353deg) brightness(90%) contrast(98%);
        }

        .edit-btn:hover img {
            filter: invert(46%) sepia(89%) saturate(1400%) hue-rotate(8deg) brightness(106%) contrast(107%);
        }

        .delete-btn:hover img {
            filter: invert(31%) sepia(100%) saturate(4818%) hue-rotate(353deg) brightness(93%) contrast(110%);
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <img src="/images/hospital.png" alt="Hospital Logo">
        <a href="/doctor">Acasă</a>
        <a href="programari.html" class="schedule">Programări</a>
        <button class="dropdown-btn">Pacienți</button>
        <div class="dropdown-container">
            <a href="vizualizare_pacienti.html">Vizualizare Pacienți</a>
            <a href="istoric_pacienti.html">Istoric Pacienți</a>
        </div>
        <a href="garda.html" class="schedule">Adăugare Gardă</a>
        <a href="contact.html">Contact</a>
    </div>
    <div class="spacer"></div>
    <form action="/logout" method="post">
        <button type="submit">Ieșire</button>
    </form>
</div>

<div class="main-content">
    <h1>Lista Pacienților</h1>

    <!-- Barra de căutare -->
    <div class="search-bar">
        <input type="text" placeholder="Căutare pacient..." />

        <!-- Select pentru Filtrare -->
        <select id="filter-gen">
            <option value="">Gen</option>
            <option value="M">Masculin</option>
            <option value="F">Feminin</option>
        </select>

        <select id="filter-rh">
            <option value="">Rh</option>
            <option value="pozitiv">Pozitiv</option>
            <option value="negativ">Negativ</option>
        </select>

        <select id="filter-sange">
            <option value="">Grupa de sânge</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="O">O</option>
            <option value="AB">AB</option>
        </select>

        <a href="/new" class="add-button">Adaugă Pacient</a>
    </div>

<!--    <a href="adauga_pacient.html" class="add-button">Adaugă Pacient</a>-->

    <div class="container">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nume</th>
                <th>Prenume</th>
                <th>CNP</th>
                <th>Data Nașterii</th>
                <th>Gen</th>
                <th>Vârstă</th>
                <th>Adresă</th>
                <th>Telefon</th>
                <th>Email</th>
                <th>Grupa de sânge</th>
                <th>Rh</th>
                <th>Acțiuni</th>
            </tr>
            </thead>
            <tbody>
            <!-- Folosim Thymeleaf pentru a itera prin lista de pacienți -->
            <tr th:each="pacient : ${pacienti}">
                <td th:text="${pacient.idPacient}"></td>
                <td th:text="${pacient.nume}"></td>
                <td th:text="${pacient.prenume}"></td>
                <td th:text="${pacient.cnp}"></td>
                <td th:text="${#dates.format(pacient.dataNasterii, 'dd/MM/yyyy')}"></td>
                <td th:text="${pacient.gen}"></td>
                <td th:text="${pacient.varsta}"></td>
                <td th:text="${pacient.adresa}"></td>
                <td th:text="${pacient.tel}"></td>
                <td th:text="${pacient.email}"></td>
                <td th:text="${pacient.grupaSange}"></td>
                <td th:text="${pacient.rh}"></td>
                <td>
                    <!-- Link pentru ștergere -->
                    <a th:href="@{/pacienti/delete/{id}(id=${pacient.idPacient})}" class="delete-btn">Șterge</a>

                    <!-- Link pentru editare -->
                    <a th:href="@{/edit/{id}(id=${pacient.idPacient})}" class="edit-btn">Editează</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
