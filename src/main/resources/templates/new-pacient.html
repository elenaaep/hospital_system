<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaugă Pacient</title>
    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Min height ensures it occupies full viewport height */
        }

        .container {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            overflow-y: auto; /* Ensures content is scrollable if too large */
            max-height: 90vh; /* Prevents container from exceeding viewport height */
        }

        /* Title styling */
        h1 {
            text-align: center;
            color: #00561B;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px; /* Adjusted margin */
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #568203;
            padding-bottom: 10px;
        }

        /* Form labels and inputs */
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #568203;
        }

        input[type="text"],
        input[type="date"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px; /* Adjusted margin */
            border: 1px solid #cfa108;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: #dab30a;
            outline: none;
        }

        /* Submit button */
        button[type="submit"] {
            background-color: #00561B;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            width: 100%;
            text-align: center;
            transition: background-color 0.3s;
            box-sizing: border-box;
        }

        button[type="submit"]:hover {
            background-color: #568203;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Adaugă un nou pacient</h1>
    <form action="/add" method="post">
        <label for="idPacient">ID Pacient:</label>
        <input type="text" id="idPacient" name="idPacient" required>

        <label for="nume">Nume:</label>
        <input type="text" id="nume" name="nume" required>

        <label for="prenume">Prenume:</label>
        <input type="text" id="prenume" name="prenume" required>

        <label for="cnp">CNP:</label>
        <input type="text" id="cnp" name="cnp" required>

        <label for="dataNasterii">Data Nașterii:</label>
        <input type="date" id="dataNasterii" name="dataNasterii" required>

        <label for="gen">Gen:</label>
        <select id="gen" name="gen" required>
            <option value="Masculin">Masculin</option>
            <option value="Feminin">Feminin</option>
        </select>

        <label for="varsta">Vârsta:</label>
        <input type="number" id="varsta" name="varsta" required>

        <label for="adresa">Adresă:</label>
        <input type="text" id="adresa" name="adresa" required>

        <label for="tel">Telefon:</label>
        <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="grupaSange">Grupa Sanguină:</label>
        <select id="grupaSange" name="grupaSange" required>
            <option value="0">0</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
        </select>

        <label for="rh">RH:</label>
        <select id="rh" name="rh" required>
            <option value="Pozitiv">Pozitiv</option>
            <option value="Negativ">Negativ</option>
        </select>

        <button type="submit">Salvează</button>
    </form>
</div>
</body>
</html>
