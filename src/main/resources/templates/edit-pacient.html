<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editează Pacient</title>
</head>
<body>
<h1>Editează Pacient</h1>
<form th:action="@{/pacienti/update/{id}(id=${pacient.idPacient})}" method="post">
    <label for="nume">Nume:</label>
    <input type="text" id="nume" name="nume" th:value="${pacient.nume}" required>
    <label for="prenume">Prenume:</label>
    <input type="text" id="prenume" name="prenume" th:value="${pacient.prenume}" required>
    <label for="cnp">CNP:</label>
    <input type="text" id="cnp" name="cnp" th:value="${pacient.cnp}" required>
    <label for="dataNasterii">Data Nașterii:</label>
    <input type="date" id="dataNasterii" name="dataNasterii" th:value="${pacient.dataNasterii}" required>
    <label for="gen">Gen:</label>
    <select id="gen" name="gen" th:value="${pacient.gen}">
        <option value="Masculin">Masculin</option>
        <option value="Feminin">Feminin</option>
    </select>
    <label for="grupaSange">Grupa Sanguină:</label>
    <input type="text" id="grupaSange" name="grupaSange" th:value="${pacient.grupaSange}">
    <label for="rh">RH:</label>
    <select id="rh" name="rh" th:value="${pacient.rh}">
        <option value="Pozitiv">Pozitiv</option>
        <option value="Negativ">Negativ</option>
    </select>
    <button type="submit">Actualizează</button>
</form>
</body>
</html>
